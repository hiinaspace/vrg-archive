[project]
name = "vrg-site"
version = "0.1.0"
description = "Static client-side search site builder for the /vrg/ archive (R1)"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "regex>=2024.9"]

[project.scripts]
vrg-site = "vrg_site.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrg_site"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["E501"]
"**/oracle/*" = ["E501"]
"**/vrg_site/index.py" = ["E501"]
"**/vrg_site/threads.py" = ["E501"]
"**/vrg_site/text.py" = ["E501"]
